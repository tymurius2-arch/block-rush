<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Block Rush">
<meta name="theme-color" content="#120d33">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Block Rush</title>
<style>
:root{--cell:#2a2268}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#120d33;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded",system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
body{background:radial-gradient(circle at 50% -10%,#3d2c97 0,#1a1347 45%,#0d0926 100%)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 8px)}
header{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;min-height:44px}
.best{font-size:16px;font-weight:700;display:flex;gap:6px;align-items:center;color:#ffd84d}
.btns button{background:rgba(255,255,255,.12);border:0;color:#fff;width:42px;height:42px;border-radius:13px;font-size:19px;margin-left:8px;cursor:pointer}
.btns button:active{transform:scale(.92)}
#scorebox{text-align:center;margin:2px 0 10px}
#score{font-size:54px;font-weight:900;line-height:1.05;text-shadow:0 4px 22px rgba(130,100,255,.7)}
#combo{height:20px;font-size:15px;font-weight:800;color:#ff9de6;opacity:0;transition:opacity .2s}
#combo.on{opacity:1}
#board{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;padding:6px;background:#160f3f;border-radius:16px;width:min(100%,480px,55vh);aspect-ratio:1;box-shadow:inset 0 0 0 2px rgba(255,255,255,.07),0 12px 34px rgba(0,0,0,.45)}
.c{border-radius:6px;background:var(--cell);position:relative}
.c.f,.blk{background:var(--col);box-shadow:inset 0 -4px 0 rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.38)}
.c.g{background:var(--col);opacity:.5;box-shadow:none}
.c.h{background:var(--col);opacity:1;box-shadow:0 0 12px 1px var(--col),inset 0 -4px 0 rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.5)}
.c.pop{animation:pop .4s ease-out forwards;z-index:2}
@keyframes pop{0%{transform:scale(1);filter:brightness(2.2)}40%{transform:scale(1.15);filter:brightness(2.5)}100%{transform:scale(.1) rotate(25deg);opacity:0}}
#board.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}
#tray{flex:1;width:100%;max-width:480px;display:flex;align-items:center;min-height:110px}
.slot{flex:1;height:100%;display:flex;align-items:center;justify-content:center}
.piece{position:relative;transition:transform .15s}
.piece .blk,#float .blk{position:absolute;border-radius:5px}
.slot.dragging .piece{visibility:hidden}
.slot.nofit .piece{filter:grayscale(1) brightness(.55)}
.slot.fresh .piece{animation:in .3s ease-out backwards}
.slot:nth-child(2).fresh .piece{animation-delay:.06s}.slot:nth-child(3).fresh .piece{animation-delay:.12s}
@keyframes in{from{transform:scale(.2) translateY(30px);opacity:0}}
#float{position:fixed;left:0;top:0;pointer-events:none;z-index:10;display:none;will-change:transform;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))}
.toast{position:fixed;font-weight:900;pointer-events:none;z-index:20;animation:up 1.1s ease-out forwards;text-shadow:0 3px 14px rgba(0,0,0,.6);white-space:nowrap}
@keyframes up{0%{transform:translate(-50%,0) scale(.5);opacity:0}18%{transform:translate(-50%,-10px) scale(1.15);opacity:1}100%{transform:translate(-50%,-80px) scale(1);opacity:0}}
#over,#hint{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(8,5,25,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#over.on,#hint.on{display:flex}
.card{background:linear-gradient(160deg,#3b2a9a,#20185a);border-radius:24px;padding:28px 24px;width:min(88vw,340px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:in .35s ease-out}
.card h2{margin:0 0 6px;font-size:28px}
.card .big{font-size:56px;font-weight:900;margin:6px 0}
.card .nb{color:#ffd84d;font-weight:900;font-size:20px;margin-bottom:6px}
.card p{opacity:.85;line-height:1.45;margin:8px 0}
.card button{margin-top:14px;width:100%;padding:16px;border:0;border-radius:16px;font-size:20px;font-weight:800;color:#1a1347;background:linear-gradient(#ffe36b,#ffb340);box-shadow:0 5px 0 #c77d12;cursor:pointer}
.card button:active{transform:translateY(3px);box-shadow:0 2px 0 #c77d12}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="best">👑 <span id="best">0</span></div>
    <div class="btns"><button id="snd" aria-label="Звук">🔊</button><button id="rst" aria-label="Заново">↻</button></div>
  </header>
  <div id="scorebox"><div id="score">0</div><div id="combo">Комбо x2</div></div>
  <div id="board"></div>
  <div id="tray"></div>
</div>
<div id="float"></div>
<div id="over"><div class="card"><h2>Нет ходов!</h2><div class="nb" id="nb">🏆 НОВЫЙ РЕКОРД!</div><div class="big" id="final">0</div><p>Рекорд: <b id="best2">0</b></p><button id="again">Играть ещё</button></div></div>
<div id="hint"><div class="card"><h2>📲 Установи на iPhone</h2><p>Нажми <b>Поделиться</b> (квадрат со стрелкой ⬆️) → <b>«На экран „Домой“»</b>.</p><p>Открой игру один раз с иконки, пока есть интернет — дальше она работает <b>без интернета</b>.</p><button id="hintok">Понятно!</button></div></div>
<script>
(()=>{
const N=8;
const COLORS=['#ff5d73','#ffa53d','#ffde3d','#47d873','#35c2ff','#7b6bff','#e45cff'];
const RAW=[
 ["X",2],["XX",4],["X\nX",4],["XXX",4],["X\nX\nX",4],["XXXX",3],["X\nX\nX\nX",3],["XXXXX",2],["X\nX\nX\nX\nX",2],
 ["XX\nXX",6],["XXX\nXXX\nXXX",2],["XXX\nXXX",2],["XX\nXX\nXX",2],
 ["XX\nX.",3],["XX\n.X",3],["X.\nXX",3],[".X\nXX",3],
 ["XXX\nX..",2],["XXX\n..X",2],["X..\nXXX",2],["..X\nXXX",2],
 ["X.\nX.\nXX",2],[".X\n.X\nXX",2],["XX\nX.\nX.",2],["XX\n.X\n.X",2],
 ["XXX\n.X.",2],[".X.\nXXX",2],["X.\nXX\nX.",2],[".X\nXX\n.X",2],
 ["XX.\n.XX",2],[".XX\nXX.",2],["X.\nXX\n.X",2],[".X\nXX\nX.",2],
 ["XXX\nX..\nX..",1],["XXX\n..X\n..X",1],["X..\nX..\nXXX",1],["..X\n..X\nXXX",1],
 ["X.\n.X",1],[".X\nX.",1]
];
const SHAPES=RAW.map(([s,wt])=>{const rows=s.split("\n"),cells=[];rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch==="X")cells.push([y,x])}));return{cells,h:rows.length,w:Math.max(...rows.map(r=>r.length)),wt}});
const TOTALW=SHAPES.reduce((a,s)=>a+s.wt,0);
function randShape(){let r=Math.random()*TOTALW;for(let i=0;i<SHAPES.length;i++){r-=SHAPES[i].wt;if(r<0)return i}return 0}

const $=id=>document.getElementById(id);
const boardEl=$('board'),trayEl=$('tray'),scoreEl=$('score'),bestEl=$('best'),floatEl=$('float'),comboEl=$('combo');
let grid,tray,score=0,best=0,streak=0,miss=0,over=false,sound=true,shownScore=0,freshTray=false,newBest=false;

const cells=[];
for(let i=0;i<N*N;i++){const d=document.createElement('div');d.className='c';boardEl.appendChild(d);cells.push(d)}
const slots=[0,1,2].map(i=>{const d=document.createElement('div');d.className='slot';trayEl.appendChild(d);d.addEventListener('pointerdown',e=>startDrag(e,i));return d});

function emptyGrid(){return Array.from({length:N},()=>Array(N).fill(-1))}
function fits(g,sh,r,c){for(const[y,x]of sh.cells){const R=r+y,C=c+x;if(R<0||C<0||R>=N||C>=N||g[R][C]>=0)return false}return true}
function anyFit(g,sh){for(let r=0;r<=N-sh.h;r++)for(let c=0;c<=N-sh.w;c++)if(fits(g,sh,r,c))return true;return false}
function fullLines(g){const rows=[],cols=[];for(let i=0;i<N;i++){if(g[i].every(v=>v>=0))rows.push(i);let f=true;for(let r=0;r<N;r++)if(g[r][i]<0){f=false;break}if(f)cols.push(i)}return{rows,cols}}

function newTray(){
  const cols=[...COLORS.keys()].sort(()=>Math.random()-.5);
  let p;
  for(let t=0;t<40;t++){
    p=[0,1,2].map(k=>({s:randShape(),c:cols[k]}));
    if(p.some(x=>anyFit(grid,SHAPES[x.s])))break;
  }
  tray=p;freshTray=true;
}

function save(){try{localStorage.setItem('br_state',JSON.stringify({grid,tray,score,streak,miss,over}));localStorage.setItem('br_best',String(best))}catch(e){}}
function load(){
  try{
    best=+localStorage.getItem('br_best')||0;
    sound=localStorage.getItem('br_sound')!=='0';
    const s=JSON.parse(localStorage.getItem('br_state')||'null');
    if(s&&s.grid&&s.tray&&!s.over){grid=s.grid;tray=s.tray;score=s.score|0;streak=s.streak|0;miss=s.miss|0;return true}
  }catch(e){}
  return false;
}

function renderBoard(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const d=cells[r*N+c],v=grid[r][c];
    d.className=v>=0?'c f':'c';
    if(v>=0)d.style.setProperty('--col',COLORS[v]);else d.style.removeProperty('--col');
  }
}
function boardMetrics(){const a=cells[0].getBoundingClientRect(),b=cells[1].getBoundingClientRect();return{x:a.left,y:a.top,size:a.width,pitch:b.left-a.left}}
function pieceEl(sh,col,pitch,size){
  const el=document.createElement('div');el.className='piece';
  el.style.width=(sh.w*pitch-(pitch-size))+'px';el.style.height=(sh.h*pitch-(pitch-size))+'px';
  for(const[y,x]of sh.cells){const b=document.createElement('div');b.className='blk';b.style.cssText=`left:${x*pitch}px;top:${y*pitch}px;width:${size}px;height:${size}px;--col:${col}`;el.appendChild(b)}
  return el;
}
function renderTray(){
  const m=boardMetrics();
  const pitch=Math.min(m.pitch*.62,(trayEl.clientWidth/3-14)/5,(trayEl.clientHeight-8)/5);
  slots.forEach((sl,i)=>{
    sl.innerHTML='';sl.className='slot'+(freshTray?' fresh':'');
    const p=tray[i];if(!p)return;
    const sh=SHAPES[p.s];
    sl.appendChild(pieceEl(sh,COLORS[p.c],pitch,pitch*.9));
    if(!anyFit(grid,sh))sl.classList.add('nofit');
  });
  freshTray=false;
}
function renderScore(){
  bestEl.textContent=best;
  comboEl.textContent='🔥 Комбо x'+streak;comboEl.classList.toggle('on',streak>=2);
  const step=()=>{if(shownScore===score)return;const d=score-shownScore;shownScore+=Math.sign(d)*Math.max(1,Math.ceil(Math.abs(d)/8));scoreEl.textContent=shownScore;requestAnimationFrame(step)};
  if(Math.abs(score-shownScore)>0&&score>shownScore)requestAnimationFrame(step);else{shownScore=score;scoreEl.textContent=score}
}
function renderAll(){renderBoard();renderTray();renderScore()}

/* ---------- drag ---------- */
let drag=null;
function startDrag(e,i){
  if(over||drag||!tray[i])return;
  e.preventDefault();unlockAudio();
  const p=tray[i],sh=SHAPES[p.s],m=boardMetrics();
  drag={i,p,sh,m,key:null,pos:null};
  floatEl.innerHTML='';floatEl.appendChild(pieceEl(sh,COLORS[p.c],m.pitch,m.size));floatEl.style.display='block';
  slots[i].classList.add('dragging');
  moveDrag(e);sfx('pick');
}
function moveDrag(e){
  if(!drag)return;
  const{sh,m}=drag;
  const fx=e.clientX-(sh.w*m.pitch)/2+m.pitch*.05,fy=e.clientY-sh.h*m.pitch-m.pitch*1.1;
  floatEl.style.transform=`translate(${fx}px,${fy}px)`;
  const c=Math.round((fx-m.x)/m.pitch),r=Math.round((fy-m.y)/m.pitch);
  const ok=fits(grid,sh,r,c),key=ok?r+','+c:null;
  if(key!==drag.key){drag.key=key;drag.pos=ok?[r,c]:null;preview()}
}
function preview(){
  renderBoard();
  if(!drag.pos)return;
  const[r,c]=drag.pos,col=COLORS[drag.p.c],g=grid.map(row=>row.slice());
  for(const[y,x]of drag.sh.cells){g[r+y][c+x]=99;const d=cells[(r+y)*N+c+x];d.className='c g';d.style.setProperty('--col',col)}
  const{rows,cols}=fullLines(g);
  const hl=(R,C)=>{const d=cells[R*N+C];d.className='c h';d.style.setProperty('--col',col)};
  rows.forEach(R=>{for(let C=0;C<N;C++)hl(R,C)});cols.forEach(C=>{for(let R=0;R<N;R++)hl(R,C)});
}
function endDrag(){
  if(!drag)return;
  const d=drag;drag=null;floatEl.style.display='none';slots[d.i].classList.remove('dragging');
  if(d.pos)place(d.i,d.pos[0],d.pos[1]);else renderBoard();
}
window.addEventListener('pointermove',moveDrag,{passive:true});
window.addEventListener('pointerup',endDrag);
window.addEventListener('pointercancel',endDrag);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- game ---------- */
const PRAISE=['','','Отлично!','Супер!','Мега!','НЕВЕРОЯТНО!','БОЖЕСТВЕННО!'];
function place(i,r,c){
  const p=tray[i],sh=SHAPES[p.s],m=boardMetrics();
  for(const[y,x]of sh.cells)grid[r+y][c+x]=p.c;
  tray[i]=null;
  let gained=sh.cells.length;
  const{rows,cols}=fullLines(grid),n=rows.length+cols.length;
  const cleared=new Map();
  if(n){
    streak++;miss=0;
    rows.forEach(R=>{for(let C=0;C<N;C++)cleared.set(R*N+C,grid[R][C])});
    cols.forEach(C=>{for(let R=0;R<N;R++)cleared.set(R*N+C,grid[R][C])});
    cleared.forEach((v,k)=>{grid[Math.floor(k/N)][k%N]=-1});
    gained+=n*n*10*streak;
    if(grid.every(row=>row.every(v=>v<0)))gained+=300,setTimeout(()=>toast('✨ ЧИСТО! +300',innerWidth/2,m.y+m.pitch*4,'#7df9ff',30),250);
  }else if(++miss>=3)streak=0;
  score+=gained;
  if(score>best){if(!newBest&&best>0)setTimeout(()=>toast('👑 Рекорд!',innerWidth/2,m.y+m.pitch*2,'#ffd84d',28),300);best=score;newBest=true}
  if(tray.every(x=>!x))newTray();
  renderAll();
  cleared.forEach((v,k)=>{const d=cells[k];d.className='c f pop';d.style.setProperty('--col',COLORS[v])});
  if(n){setTimeout(()=>{if(!drag)renderBoard()},420);boardEl.classList.remove('shake');void boardEl.offsetWidth;if(n>=2)boardEl.classList.add('shake')}
  const tx=m.x+(c+sh.w/2)*m.pitch,ty=m.y+r*m.pitch;
  toast('+'+gained,tx,ty,'#fff',n?30:22);
  if(n>=2)toast(PRAISE[Math.min(n,6)],innerWidth/2,m.y+m.pitch*3.2,COLORS[p.c],38);
  else if(n&&streak>=3)toast('Комбо x'+streak+'!',innerWidth/2,m.y+m.pitch*3.2,'#ff9de6',32);
  sfx(n?'clear':'place',n);
  if(!tray.some(t=>t&&anyFit(grid,SHAPES[t.s]))){over=true;setTimeout(gameOver,700)}
  save();
}
function toast(text,x,y,color,size){
  const t=document.createElement('div');t.className='toast';t.textContent=text;
  t.style.cssText=`left:${Math.max(70,Math.min(innerWidth-70,x))}px;top:${y}px;color:${color};font-size:${size}px`;
  document.body.appendChild(t);setTimeout(()=>t.remove(),1150);
}
function gameOver(){
  sfx('over');
  $('final').textContent=score;$('best2').textContent=best;
  $('nb').style.display=newBest&&score>0?'block':'none';
  $('over').classList.add('on');save();
}
function newGame(){
  grid=emptyGrid();score=0;shownScore=0;streak=0;miss=0;over=false;newBest=false;
  newTray();$('over').classList.remove('on');renderAll();save();
}
$('again').onclick=()=>{unlockAudio();newGame()};
$('rst').onclick=()=>{if(over||score===0||confirm('Начать заново?'))newGame()};
$('snd').onclick=()=>{sound=!sound;$('snd').textContent=sound?'🔊':'🔇';try{localStorage.setItem('br_sound',sound?'1':'0')}catch(e){};unlockAudio()};

/* ---------- sound ---------- */
let ac=null;
function unlockAudio(){if(!sound)return;try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state!=='running')ac.resume()}catch(e){}}
function tone(f,t0,d,type,v){const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.03)}
function sfx(k,n){
  if(!sound||!ac)return;
  try{
    if(k==='pick')tone(620,0,.05,'triangle',.07);
    else if(k==='place'){tone(220,0,.08,'square',.05);tone(330,.02,.07,'triangle',.06)}
    else if(k==='clear'){const base=392*Math.pow(2,Math.min(streak-1,8)/12);for(let j=0;j<Math.min(n+2,7);j++)tone(base*Math.pow(1.26,j),j*.055,.22,'triangle',.11)}
    else if(k==='over')[392,330,262,196].forEach((f,j)=>tone(f,j*.16,.35,'sine',.12));
  }catch(e){}
}

/* ---------- start ---------- */
if(!load()){grid=emptyGrid();newTray()}
shownScore=score;
$('snd').textContent=sound?'🔊':'🔇';
renderAll();
if(!tray.some(t=>t&&anyFit(grid,SHAPES[t.s]))){over=true;gameOver()}
addEventListener('resize',()=>renderTray());

const standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
try{if(ios&&!standalone&&!localStorage.getItem('br_hint')){$('hint').classList.add('on')}}catch(e){}
$('hintok').onclick=()=>{$('hint').classList.remove('on');try{localStorage.setItem('br_hint','1')}catch(e){}};

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
