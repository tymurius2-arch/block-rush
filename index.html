<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="100 игр">
<meta name="theme-color" content="#14112e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>100 игр</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#14112e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
#menu{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 20px);background:radial-gradient(circle at 50% -10%,#3d2c97 0,#1a1347 40%,#0d0926 100%) fixed}
#menu h1{margin:4px 0 2px;font-size:34px;font-weight:900;text-align:center;letter-spacing:-.5px}
#menu .sub{text-align:center;opacity:.7;font-size:14px;margin-bottom:12px}
#rand{display:block;margin:0 auto 12px;width:100%;max-width:520px;padding:14px;border:0;border-radius:16px;font-size:18px;font-weight:800;color:#1a1347;background:linear-gradient(#ffe36b,#ffb340);box-shadow:0 4px 0 #c77d12}
#rand:active{transform:translateY(2px);box-shadow:0 2px 0 #c77d12}
#cats{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;max-width:900px;margin:0 auto;scrollbar-width:none}
#cats::-webkit-scrollbar{display:none}
#cats button{flex:none;border:0;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font-size:14px;font-weight:700}
#cats button.on{background:#fff;color:#1a1347}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;max-width:900px;margin:0 auto}
.tile{position:relative;border:0;border-radius:18px;padding:12px 6px 10px;background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.04));color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.tile:active{transform:scale(.95)}
.tile .e{font-size:38px;line-height:1.1}
.tile .n{font-size:13px;font-weight:700;text-align:center;line-height:1.15;min-height:30px;display:flex;align-items:center}
.tile .b{font-size:11px;color:#ffd84d;font-weight:700;min-height:13px}
.tile .num{position:absolute;top:6px;left:9px;font-size:10px;opacity:.45;font-weight:700}
#play{position:fixed;inset:0;display:none;flex-direction:column;background:#14112e}
#bar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;background:#1b1640}
#bar button{border:0;background:rgba(255,255,255,.12);color:#fff;width:42px;height:42px;border-radius:13px;font-size:20px;flex:none}
#title{flex:1;font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sc{font-weight:900;font-size:22px;min-width:40px;text-align:right}
#bs{font-size:13px;color:#ffd84d;font-weight:700;min-width:44px;text-align:right}
#wrap{flex:1;position:relative;margin-bottom:env(safe-area-inset-bottom)}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block}
#ov{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(8,5,25,.75);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
#ov.on{display:flex}
.card{background:linear-gradient(160deg,#3b2a9a,#20185a);border-radius:24px;padding:24px 22px;width:min(88vw,360px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.card .e{font-size:64px;line-height:1}
.card h2{margin:8px 0 6px;font-size:26px}
.card p{opacity:.88;line-height:1.45;margin:8px 0;font-size:16px}
.card .big{font-size:52px;font-weight:900;margin:4px 0}
.card .nb{color:#ffd84d;font-weight:900;font-size:19px}
.card .row{display:flex;gap:10px;margin-top:14px}
.card button{flex:1;padding:15px 8px;border:0;border-radius:16px;font-size:18px;font-weight:800}
.card .go{color:#1a1347;background:linear-gradient(#ffe36b,#ffb340);box-shadow:0 4px 0 #c77d12}
.card .alt{color:#fff;background:rgba(255,255,255,.14)}
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:4;font-weight:900;font-size:30px;pointer-events:none;text-shadow:0 3px 14px rgba(0,0,0,.7);opacity:0;transition:opacity .25s;white-space:nowrap}
#hint{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(8,5,25,.8)}
#hint.on{display:flex}
</style>
</head>
<body>
<div id="menu">
  <h1>🎮 100 игр</h1>
  <div class="sub">Всё работает без интернета</div>
  <button id="rand">🎲 Случайная игра</button>
  <div id="cats"></div>
  <div id="list"></div>
</div>
<div id="play">
  <div id="bar"><button id="back" aria-label="Назад">←</button><div id="title"></div><div id="sc">0</div><div id="bs"></div><button id="snd" aria-label="Звук">🔊</button></div>
  <div id="wrap"><canvas id="cv"></canvas></div>
</div>
<div id="ov"><div class="card" id="card"></div></div>
<div id="toast"></div>
<div id="hint"><div class="card"><div class="e">📲</div><h2>Установи на iPhone</h2><p>Нажми <b>Поделиться</b> ⬆️ → <b>«На экран „Домой“»</b>.</p><p>Открой один раз с иконки, пока есть интернет — потом всё работает <b>без интернета</b>.</p><div class="row"><button class="go" id="hintok">Понятно</button></div></div></div>
<script src="engine.js"></script>
<script src="games1.js"></script>
<script src="games2.js"></script>
<script src="games3.js"></script>
<script src="games4.js"></script>
<script src="games5.js"></script>
<script>G.start()</script>
</body>
</html>
